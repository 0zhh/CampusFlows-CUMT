# 生产形态：Docker MySQL 8.4（宿主 3307），表结构由 db/migration 下的 SQL 建好
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/campusflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: __MYSQL_PASSWORD_REMOVED__
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none   # 表结构以 db/migration 下的 SQL 为准，不校验也不自动改
    open-in-view: false
  h2:
    console:
      enabled: false
