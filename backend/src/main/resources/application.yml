server:
  port: 8080
spring:
  application:
    name: campusflow
  datasource:
    url: jdbc:h2:file:./data/campusflow;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    edu.cumt.campusflow: INFO
    org.hibernate.SQL: WARN
