server:
  port: 8080
spring:
  application:
    name: campusflow
  profiles:
    active: dev
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    edu.cumt.campusflow: INFO
    org.hibernate.SQL: WARN
